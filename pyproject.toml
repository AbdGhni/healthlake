[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "healthlake"
version = "0.1.0"
description = "Synthetic healthcare data engineering demonstration (FHIR R4, PostgreSQL, dbt, Airflow, FastAPI)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.14,<3",
  "sqlalchemy>=2.1,<2.2",
  "psycopg[binary]>=3.3,<3.4",
  "fastapi>=0.143,<0.144",
  "uvicorn>=0.54,<0.55",
  "httpx>=0.28,<0.29",
  "polars>=2.0,<2.1",
  "pyarrow>=26,<27",
  "prometheus-client>=0.26,<0.27",
]

[project.scripts]
healthlake = "healthlake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF"]
ignore = ["S101", "S603", "S607", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["healthlake", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["healthlake"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: needs a PostgreSQL server (HEALTHLAKE_TEST_DSN)",
  "java: needs Java and the HL7 validator jar",
  "slow: long-running",
]
