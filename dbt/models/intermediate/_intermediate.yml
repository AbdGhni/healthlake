version: 2
models:
  - name: int_encounter
    description: "Grain: one encounter. Adds encounter_category (seed) and duration_minutes (NULL without end)."
    columns:
      - name: encounter_key
        data_tests: [unique, not_null]
  - name: int_observation_value
    description: "Grain: one observation. value_canonical only through the approved unit_conversion seed."
    columns:
      - name: entity_id
        data_tests: [unique, not_null]
