name: healthlake
version: "0.1.0"
config-version: 2
profile: healthlake

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "logs"]

vars:
  snapshot_id: "unset"
  release_id: "unset"
  inject_gate_failure: false

models:
  healthlake:
    +persist_docs: {relation: true, columns: true}
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
      # fresh statistics before the release gate and the API read the tables; facts analyze in their own
      # post-hooks, after their expression indexes exist (ANALYZE collects expression-index statistics)
      dimensions:
        +post-hook: "analyze {{ this }}"
      aggregates:
        +post-hook: "analyze {{ this }}"

seeds:
  healthlake:
    +schema: null
